name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and run full test suite
        run: docker build --progress=plain -t wa-bot-ci .
